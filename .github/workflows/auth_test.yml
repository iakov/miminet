name: Yandex and Telegram authentication and Miminet authorization tests

on:
  workflow_run:
    workflows: [Linter]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: test_env
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Installing dependencies
      run: |
        uv sync --frozen

    - name: Running tests
      run: |
        source .venv/bin/activate
        cd front/src
        # Raw run under coverage so this lane contributes front/src data to
        # the cross-lane merge. No gate here (auth lane is the flake signal);
        # --source=. scopes measurement to front/src (not site-packages).
        python -m coverage run --branch --source=. \
          --data-file=".coverage.auth" -m pytest -vv .
      env:
          CLIENT_YANDEX: ${{ secrets.CLIENT_YANDEX }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

    - name: Upload auth coverage data
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: front-auth-coverage-data
        path: front/src/.coverage.auth
        include-hidden-files: true
        if-no-files-found: ignore
